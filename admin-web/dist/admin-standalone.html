<style>

  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10181c; --surface:#18242a; --ink:#e8eeee; --muted:#9db0b4; --line:#2b3b42;
      --primary:#4cc2b9; --primary-ink:#06211f; --danger:#ff8a7a; --warn:#f0b35a; --ok:#6fd49a; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;
    padding-top:env(safe-area-inset-top,0)}
  header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
  header strong{font-size:1rem}
  main{padding:16px 16px 96px;max-width:680px;margin:0 auto}
  h1{font-size:1.25rem;margin:8px 0 16px} h2{font-size:1.05rem;margin:0 0 8px}

    width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}

  button.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
  button.small{min-height:40px;padding:0 12px;font-size:.92rem}
  button:disabled{opacity:.55}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  :focus-visible{outline:3px solid var(--primary);outline-offset:2px}
  .hint{color:var(--muted);font-size:.9rem}
  .msg{padding:10px 12px;border-radius:8px;margin:12px 0;border:1px solid var(--line)}
  .msg.err{color:var(--danger);border-color:var(--danger)} .msg.ok{color:var(--ok);border-color:var(--ok)}
  .msg.warn{color:var(--warn);border-color:var(--warn)}

    padding-bottom:env(safe-area-inset-bottom,0)}
  nav button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);min-height:56px;padding:0 4px;font-size:.9rem}
  nav button[aria-current=page]{color:var(--primary);box-shadow:inset 0 3px 0 var(--primary)}
  .log{font-size:.92rem;border-bottom:1px solid var(--line);padding:10px 0}
  .log:last-child{border-bottom:0} .log small{color:var(--muted);display:block}
  .card{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .card:last-child{border-bottom:0}
  .thumb{width:72px;height:72px;flex:none;border-radius:8px;border:1px solid var(--line);object-fit:contain;
    background:repeating-conic-gradient(#e6e6e6 0 25%,#fff 0 50%) 0 0/16px 16px}
  .card .body{flex:1;min-width:0}
  .card .title{font-weight:600}
  .badge{display:inline-block;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:.8rem;color:var(--muted)}
  .badge.published{color:var(--ok);border-color:var(--ok)} .badge.pending{color:var(--warn);border-color:var(--warn)}
  .badge.rejected{color:var(--danger);border-color:var(--danger)}
  details{margin-top:8px} summary{cursor:pointer;color:var(--primary);min-height:40px;display:flex;align-items:center}
  .stage{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;
    background:repeating-conic-gradient(#e6e6e6 0 25%,#fff 0 50%) 0 0/16px 16px;touch-action:manipulation}
  .stage img{display:block;max-width:100%;height:auto}
  .dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#e91e63;border:2px solid #fff;box-shadow:0 0 0 1px #0006;pointer-events:none}
  .box{position:absolute;border:2px solid var(--primary);background:#0e6b6633;pointer-events:none}
  .box.off{border-style:dashed;opacity:.45} .box.live{border-style:dotted;border-color:#e91e63;background:#e91e6322}
  .lbl{position:absolute;top:0;left:0;background:var(--primary);color:var(--primary-ink);font-size:11px;padding:0 4px;line-height:1.5}
  [hidden]{display:none!important}
</style>
</head>

<script>
// خوارزميات تقطيع الصور (بلا DOM) — قابلة للاختبار في Node ومستخدمة في المتصفح عبر window.SliceCore
(function (root) {
  "use strict";

  /** تقسيم شبكي. margin = هامش الصورة، gap = المسافة بين الخلايا. */
  function gridRects(w, h, rows, cols, margin, gap) {
    rows = Math.max(1, Math.floor(rows)); cols = Math.max(1, Math.floor(cols));
    margin = Math.max(0, Math.floor(margin || 0)); gap = Math.max(0, Math.floor(gap || 0));
    const cw = Math.floor((w - 2 * margin - gap * (cols - 1)) / cols);
    const ch = Math.floor((h - 2 * margin - gap * (rows - 1)) / rows);
    if (cw < 1 || ch < 1) return [];
    const out = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      out.push({ x: margin + c * (cw + gap), y: margin + r * (ch + gap), w: cw, h: ch });
    return out;
  }

  /** كشف الأجزاء المنفصلة بقناة الشفافية (اتصال 8 جهات). يرجع مستطيلًا محيطًا لكل جزء. */
  function findComponents(alpha, w, h, threshold) {
    const t = threshold == null ? 8 : threshold;
    const visited = new Uint8Array(w * h);
    const stack = new Int32Array(w * h); // كل بكسل يُدفع مرة واحدة فقط
    const boxes = [];
    for (let start = 0; start < w * h; start++) {
      if (visited[start] || alpha[start] <= t) continue;
      let sp = 0; stack[sp++] = start; visited[start] = 1;
      let minX = w, minY = h, maxX = -1, maxY = -1, area = 0;
      while (sp > 0) {
        const p = stack[--sp]; const x = p % w; const y = (p - x) / w;
        area++;
        if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
        for (let dy = -1; dy <= 1; dy++) {
          const ny = y + dy; if (ny < 0 || ny >= h) continue;
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            const nx = x + dx; if (nx < 0 || nx >= w) continue;
            const q = ny * w + nx;
            if (!visited[q] && alpha[q] > t) { visited[q] = 1; stack[sp++] = q; }
          }
        }
      }
      boxes.push({ x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1, area });
    }
    return boxes;
  }

  function near(a, b, gap) {
    return a.x - gap <= b.x + b.w && b.x - gap <= a.x + a.w && a.y - gap <= b.y + b.h && b.y - gap <= a.y + a.h;
  }

  /** دمج المستطيلات المتقاربة (مسافة ≤ gap) — لجمع أجزاء تنتمي لعنصر واحد (مثل شعر متقطع). */
  function mergeBoxes(boxes, gap) {
    const list = boxes.map((b) => Object.assign({}, b));
    let changed = true;
    while (changed) {
      changed = false;
      outer: for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          if (near(list[i], list[j], gap)) {
            const a = list[i], b = list[j];
            const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
            list[i] = { x, y, w: Math.max(a.x + a.w, b.x + b.w) - x, h: Math.max(a.y + a.h, b.y + b.h) - y, area: (a.area || 0) + (b.area || 0) };
            list.splice(j, 1); changed = true; break outer;
          }
        }
      }
    }
    return list;
  }

  /** أضيق مستطيل يحيط بالبكسلات غير الشفافة داخل r، أو null إن كان فارغًا. */
  function trimRect(alpha, w, h, r, threshold) {
    const t = threshold == null ? 8 : threshold;
    let minX = r.x + r.w, minY = r.y + r.h, maxX = -1, maxY = -1;
    const x1 = Math.min(r.x + r.w, w), y1 = Math.min(r.y + r.h, h);
    for (let y = Math.max(0, r.y); y < y1; y++) for (let x = Math.max(0, r.x); x < x1; x++) {
      if (alpha[y * w + x] > t) {
        if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    return maxX < 0 ? null : { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
  }

  /** عدد البكسلات المرئية (شفافية > العتبة) داخل المستطيل. */
  function countOpaque(alpha, w, h, r, threshold) {
    const t = threshold == null ? 8 : threshold;
    let n = 0;
    const x1 = Math.min(r.x + r.w, w), y1 = Math.min(r.y + r.h, h);
    for (let y = Math.max(0, r.y); y < y1; y++) for (let x = Math.max(0, r.x); x < x1; x++) if (alpha[y * w + x] > t) n++;
    return n;
  }

  /** الخطوة الأولى قبل التقطيع: حذف الخلايا الشفافة (التي فيها أقل من minPixels بكسل مرئي). */
  function filterEmpty(alpha, w, h, rects, threshold, minPixels) {
    const need = Math.max(1, Math.floor(minPixels == null ? 1 : minPixels));
    const kept = rects.filter((r) => countOpaque(alpha, w, h, r, threshold) >= need);
    return { kept, removed: rects.length - kept.length };
  }

  function padRect(r, pad, w, h) {
    const x = Math.max(0, r.x - pad), y = Math.max(0, r.y - pad);
    return { x, y, w: Math.min(w, r.x + r.w + pad) - x, h: Math.min(h, r.y + r.h + pad) - y };
  }

  function clampRect(r, w, h) {
    const x = Math.min(Math.max(0, Math.round(r.x)), w - 1), y = Math.min(Math.max(0, Math.round(r.y)), h - 1);
    return { x, y, w: Math.max(1, Math.min(Math.round(r.w), w - x)), h: Math.max(1, Math.min(Math.round(r.h), h - y)) };
  }

  /** ترتيب القراءة (صفوف من الأعلى للأسفل ثم من اليسار لليمين) لتسمية متوقعة. */
  function sortReadingOrder(rects) {
    return rects.slice().sort((a, b) =>
      Math.abs(a.y - b.y) > Math.min(a.h, b.h) / 2 ? a.y - b.y : a.x - b.x);
  }

  const api = { gridRects, findComponents, mergeBoxes, trimRect, countOpaque, filterEmpty, padRect, clampRect, sortReadingOrder };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.SliceCore = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>

<script>
"use strict";
const STORE_KEY = "cs_admin_cfg";
const CFG_KEYS = ["SUPABASE_URL", "SUPABASE_ANON_KEY", "CLOUDINARY_CLOUD_NAME", "CLOUDINARY_UNSIGNED_PRESET"];
function loadStored() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { return {}; } }
// القيم من config.js إن وُجدت، وإلا ما أدخلته في صفحة الإعداد (محفوظ في هذا المتصفح فقط)
const cfg = (() => { const f = window.APP_CONFIG || {}, st = loadStored(), o = {}; for (const k of CFG_KEYS) o[k] = f[k] || st[k] || ""; return o; })();
const root = document.getElementById("root");
const nav = document.getElementById("nav");
const logoutBtn = document.getElementById("logout");
let sb = null, tab = "dashboard";

// ---------- أدوات ----------
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) e.append(kid instanceof Node ? kid : document.createTextNode(kid ?? ""));
  return e;
}
const msg = (text, kind) => h("div", { class: "msg " + (kind || ""), role: kind === "err" ? "alert" : "status" }, text);
const show = (...nodes) => root.replaceChildren(...nodes);
const loading = (title) => show(h("h1", {}, title), h("p", { class: "hint" }, "جارٍ التحميل…"));
function sel(id, options, value) {
  const s = h("select", { id }, options.map(([v, l]) => h("option", { value: v }, l)));
  if (value != null) s.value = value;
  return s;
}
function field(label, input) { return [h("label", { for: input.id }, label), input]; }

const STYLES = { realistic_2d: "واقعي ثنائي الأبعاد", cartoon: "كرتوني", anime: "أنمي", simple_game: "ألعاب مبسّط" };
const ANGLES = { front: "أمامي", side: "جانبي", back: "خلفي", three_quarter: "ثلاثة أرباع" };
const STATUS_AR = { draft: "مسودة", published: "منشور", hidden: "مخفي", archived: "مؤرشف" };
const LICENSE_AR = { pending: "قيد المراجعة", approved: "معتمد", rejected: "مرفوض" };
const ANCHORS = [
  ["head_center", "مركز الرأس"], ["head_base", "قاعدة الرأس"], ["neck", "الرقبة"], ["torso_top", "أعلى الجذع"],
  ["torso_bottom", "أسفل الجذع"], ["shoulder_r", "الكتف الأيمن"], ["shoulder_l", "الكتف الأيسر"],
  ["elbow_r", "المرفق الأيمن"], ["elbow_l", "المرفق الأيسر"], ["wrist_r", "الرسغ الأيمن"], ["wrist_l", "الرسغ الأيسر"],
  ["hand_r", "اليد اليمنى"], ["hand_l", "اليد اليسرى"], ["hip_r", "الورك الأيمن"], ["hip_l", "الورك الأيسر"],
  ["knee_r", "الركبة اليمنى"], ["knee_l", "الركبة اليسرى"], ["ankle_r", "الكاحل الأيمن"], ["ankle_l", "الكاحل الأيسر"],
  ["weapon_r", "تثبيت سلاح (يمين)"], ["weapon_l", "تثبيت سلاح (يسار)"], ["accessory_head", "تثبيت إكسسوار الرأس"],
  ["accessory_back", "تثبيت إكسسوار الظهر"], ["accessory_waist", "تثبيت إكسسوار الخصر"],
];
const MAIN_CATEGORIES = [
  ["human_bodies", "أجسام بشرية"], ["heads", "رؤوس"], ["face_shapes", "أشكال وجوه"], ["eyes", "عيون"], ["eyebrows", "حواجب"],
  ["noses", "أنوف"], ["mouths", "أفواه"], ["ears", "آذان"], ["hairstyles", "تسريحات شعر"], ["beards_mustaches", "لحى وشوارب"],
  ["skin_tones", "ألوان بشرة"], ["tops", "ملابس علوية"], ["bottoms", "ملابس سفلية"], ["dresses_outfits", "فساتين وأزياء متنوعة"],
  ["shoes", "أحذية"], ["gloves", "قفازات"], ["hats", "قبعات"], ["helmets", "خوذ"], ["armor", "دروع"],
  ["accessories", "إكسسوارات"], ["weapons", "أسلحة"], ["bags", "حقائب"], ["wings_fantasy", "أجنحة وعناصر خيالية"],
  ["poses", "أوضاع جسدية"], ["backgrounds", "خلفيات"], ["decorative", "عناصر زخرفية"],
];
const MAX_BYTES = 5 * 1024 * 1024;

const ERRORS = {
  forbidden: "هذا الإجراء للمسؤولين فقط.",
  invalid_points_per_ad: "نقاط الإعلان يجب أن تكون بين 0 و1000.",
  invalid_daily_limit: "الحد اليومي يجب أن يكون بين 0 و100 (0 = بلا حد).",
  invalid_min_watch_seconds: "أقل زمن مشاهدة يجب أن يكون بين 5 و120 ثانية.",
  invalid_ticket_ttl_seconds: "صلاحية التذكرة يجب أن تكون بين 60 و3600 ثانية.",
  publish_requires_version: "لا يمكن النشر: لا توجد نسخة للأصل.",
  publish_requires_approved_commercial_license: "لا يمكن النشر: يلزم ترخيص معتمد يسمح بالاستخدام التجاري.",
  invalid_anchors: "نقاط التثبيت غير صالحة (يجب أن تقع داخل أبعاد الصورة).",
  assets_check: "تحقق من التسعير: الأصل المجاني تكلفته 0، والمدفوع تكلفته أكبر من 0.",
  duplicate: "القيمة موجودة من قبل.",
};
function explain(err) {
  const t = (err && (err.message || err.details)) || "";
  for (const k of Object.keys(ERRORS)) if (t.includes(k)) return ERRORS[k];
  if (/duplicate key/i.test(t)) return ERRORS.duplicate;
  return "تعذّر تنفيذ العملية: " + (t || "خطأ غير معروف");
}
const thumb = (publicId, size = 160) => cfg.CLOUDINARY_CLOUD_NAME && publicId
  ? `https://res.cloudinary.com/${encodeURIComponent(cfg.CLOUDINARY_CLOUD_NAME)}/image/upload/c_limit,w_${size},h_${size}/${publicId}` : "";

// ---------- الدخول ----------
function keyProblem(key) {
  const k = (key || "").trim();
  if (!k) return "أدخل المفتاح العام.";
  if (k.startsWith("sb_secret_")) return "هذا مفتاح سري (secret). لا تستخدمه هنا أبدًا؛ استخدم المفتاح العام (publishable / anon).";
  if (k.startsWith("sb_publishable_")) return null;
  const parts = k.split(".");
  if (parts.length === 3) {
    try {
      const p = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
      if (p.role === "service_role") return "هذا مفتاح service_role السري. لا تضعه هنا أبدًا.";
      if (p.role === "anon") return null;
    } catch (e) { /* يسقط إلى الرسالة العامة */ }
  }
  return "صيغة المفتاح غير معروفة. انسخ المفتاح العام (anon / publishable) من Project Settings → API.";
}
const urlOk = (u) => /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test((u || "").trim());

function connectView(error) {
  const url = h("input", { type: "url", id: "cu", dir: "ltr", placeholder: "https://xxxx.supabase.co", value: cfg.SUPABASE_URL });
  const key = h("input", { type: "text", id: "ck", dir: "ltr", placeholder: "sb_publishable_… أو eyJ…", value: cfg.SUPABASE_ANON_KEY, autocomplete: "off" });
  const cloud = h("input", { type: "text", id: "cc", dir: "ltr", placeholder: "اسم سحابة Cloudinary", value: cfg.CLOUDINARY_CLOUD_NAME });
  const preset = h("input", { type: "text", id: "cp", dir: "ltr", placeholder: "اتركه فارغًا (الأكثر أمانًا)", value: cfg.CLOUDINARY_UNSIGNED_PRESET });
  const box = h("div");
  const form = h("form", { class: "panel", onsubmit: (ev) => {
    ev.preventDefault();
    if (!urlOk(url.value)) return box.replaceChildren(msg("الرابط يجب أن يكون بالشكل https://xxxx.supabase.co", "err"));

/** رفع صورة إلى Cloudinary: بتوقيع من الدالة sign-upload (الأفضل)، أو بـ unsigned preset إن حددته. */
async function uploadToCloudinary(blob, filename) {
  const fd = new FormData();
  fd.append("file", blob, filename || "image");
  let cloud;
  if (cfg.CLOUDINARY_UNSIGNED_PRESET) {
    cloud = cfg.CLOUDINARY_CLOUD_NAME;
    if (!cloud) throw new Error("أدخل اسم سحابة Cloudinary في إعداد الاتصال.");
    const id = (crypto.randomUUID ? crypto.randomUUID() : [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join(""));
    fd.append("upload_preset", cfg.CLOUDINARY_UNSIGNED_PRESET);
    fd.append("public_id", "characterstudio/assets/" + id);
  } else {
    const { data: sig, error: se } = await sb.functions.invoke("sign-upload", { body: {} });
    if (se || !sig || !sig.signature) throw new Error("تعذّر الحصول على توقيع الرفع. انشر الدالة sign-upload وأضف أسرار Cloudinary، أو حدّد unsigned preset في إعداد الاتصال.");
    cloud = sig.cloud_name;
    fd.append("api_key", sig.api_key); fd.append("timestamp", sig.timestamp); fd.append("signature", sig.signature);
    fd.append("public_id", sig.public_id); fd.append("allowed_formats", sig.allowed_formats);
  }
  const up = await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(cloud)}/image/upload`, { method: "POST", body: fd });
  const res = await up.json().catch(() => ({}));
  if (!up.ok) throw new Error("فشل الرفع: " + ((res.error && res.error.message) || up.status));
  return res;
}

function anchorPlacer() {
  const anchors = new Map();
  const img = h("img", { alt: "معاينة الأصل", draggable: "false" });
  const stage = h("div", { class: "stage" }, img);
  const pick = sel("apick", ANCHORS);
  const list = h("div");
  const size = { w: 0, h: 0 };
  const redraw = () => {
    stage.querySelectorAll(".dot").forEach(d => d.remove());
    list.replaceChildren(...[...anchors].map(([id, p]) => {
      stage.append(h("div", { class: "dot", style: `left:${p.x / size.w * 100}%;top:${p.y / size.h * 100}%` }));
      const label = (ANCHORS.find(a => a[0] === id) || [id, id])[1];
      return h("div", { class: "row" }, h("dt", {}, `${label} (${p.x}, ${p.y})`),
        h("dd", {}, h("button", { type: "button", class: "small danger", onclick: () => { anchors.delete(id); redraw(); } }, "حذف")));
    }));
  };
  stage.addEventListener("click", (ev) => {
    if (!size.w) return;
    const r = img.getBoundingClientRect();
    const x = Math.round(Math.min(Math.max((ev.clientX - r.left) / r.width * size.w, 0), size.w));
    const y = Math.round(Math.min(Math.max((ev.clientY - r.top) / r.height * size.h, 0), size.h));
    anchors.set(pick.value, { x, y }); redraw();
  });
  img.addEventListener("load", () => { size.w = img.naturalWidth; size.h = img.naturalHeight; anchors.clear(); redraw(); });
  return {
    node: h("div", {}, h("p", { class: "hint" }, "اختر النقطة ثم المس موضعها على الصورة. اختياري، ويمكن تركه فارغًا."),
      ...field("نقطة التثبيت", pick), stage, h("dl", {}, list)),
    setFile: (file) => { img.src = URL.createObjectURL(file); },
    size, anchors: () => [...anchors].map(([id, p]) => ({ id, x: p.x, y: p.y })),
  };
}

async function sha256Hex(file) {
  const d = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function assetForm(existing, cats, lics) {
  const isNew = !existing;
  const out = h("div");
  const file = h("input", { type: "file", id: "file", accept: "image/png,image/webp", required: true });
  const placer = anchorPlacer();
  file.addEventListener("change", () => { if (file.files[0]) placer.setFile(file.files[0]); });
  const name = h("input", { type: "text", id: "an", maxlength: "80", required: true });
  const cat = sel("ac", cats.filter(x => x.active).map(x => [x.id, x.name_ar]));
  const style = sel("as", Object.entries(STYLES));
  const angle = sel("aa", Object.entries(ANGLES));
  const access = sel("aacc", [["free", "مجاني"], ["paid", "مدفوع"]]);
  const pts = h("input", { type: "number", id: "apts", min: "0", max: "100000", value: "0" });
  const lic = sel("al", [["", "— بلا ترخيص (لن يمكن نشره) —"], ...lics.map(y => [y.id, `${y.name} (${LICENSE_AR[y.status]})`])]);
  const btn = h("button", { type: "submit" }, isNew ? "رفع وإنشاء الأصل" : "رفع النسخة الجديدة");

  const form = h("form", { class: "panel", onsubmit: async (ev) => {
    ev.preventDefault();
    const f = file.files[0];
    const say = (m, k) => out.replaceChildren(msg(m, k));
    try {
      btn.disabled = true;
      if (isNew && !cat.value) throw new Error("لا توجد فئة مفعّلة. أنشئ الفئات من تبويب «الفئات» أولًا.");
      if (isNew && !name.value.trim()) throw new Error("أدخل اسم الأصل.");
      if (!f) throw new Error("اختر ملف الصورة.");
      if (!["image/png", "image/webp"].includes(f.type)) throw new Error("الصيغ المسموحة: PNG أو WebP فقط.");
      if (f.size > MAX_BYTES) throw new Error("حجم الملف يتجاوز 5 ميغابايت.");
      const w = placer.size.w, ht = placer.size.h;
      if (!w || w < 16 || ht < 16 || w > 4096 || ht > 4096) throw new Error("أبعاد الصورة يجب أن تكون بين 16 و4096 بكسل.");
      if (isNew && access.value === "paid" && !(parseInt(pts.value, 10) > 0)) throw new Error("الأصل المدفوع يحتاج تكلفة بالنقاط أكبر من 0.");

      say("جارٍ رفع الصورة إلى Cloudinary…");
      const res = await uploadToCloudinary(f, f.name);
      if (!["png", "webp"].includes(res.format) || res.bytes > MAX_BYTES || res.width !== w || res.height !== ht) {
        throw new Error("نتيجة الرفع لا تطابق الملف (الصيغة/الحجم/الأبعاد). لم يُنشأ الأصل.");
      }

      say("جارٍ حفظ الأصل…");
      const version = { file_type: res.format, file_public_id: res.public_id, thumb_public_id: res.public_id, width: res.width,
        height: res.height, file_bytes: res.bytes, sha256: await sha256Hex(f), anchors: placer.anchors(), compatibility: {}, min_app_version: 1 };
      const { error } = isNew
        ? await sb.rpc("admin_create_asset", { p_category: cat.value, p_name: name.value.trim(), p_style: style.value, p_angle: angle.value,
            p_access: access.value, p_points: access.value === "free" ? 0 : parseInt(pts.value, 10), p_license: lic.value || null, p_version: version })
        : await sb.rpc("admin_add_asset_version", { p_asset: existing.id, p_version: version });
      if (error) throw error;
      assetsView(msg(isNew ? "أُنشئ الأصل كمسودة. اعتمد ترخيصه ثم انشره." : "أُضيفت النسخة الجديدة.", "ok"));
    } catch (e) {
      say(e instanceof Error && !("code" in e) ? e.message : explain(e), "err");
      btn.disabled = false;
    }
  } },
    isNew ? [...field("اسم الأصل", name), ...field("الفئة", cat), ...field("النمط الفني", style), ...field("الزاوية", angle),
      ...field("الوصول", access), ...field("التكلفة بالنقاط (للمدفوع)", pts), ...field("الترخيص", lic)]
      : h("p", { class: "hint" }, `نسخة جديدة للأصل: ${existing.name_ar}`),
    ...field("ملف الصورة (PNG أو WebP، حتى 5 ميغابايت، 16-4096 بكسل)", file), placer.node, out,
    h("div", { class: "actions" }, btn, h("button", { type: "button", class: "secondary", onclick: () => assetsView() }, "إلغاء")));
  show(h("h1", {}, isNew ? "إضافة أصل" : "نسخة جديدة"), form);
}

// ---------- الإعلانات ----------
async function adsView() {
  loading("الإعلانات المكافأة");
  const { data, error } = await sb.from("app_settings").select("value").eq("key", "rewarded_ads").maybeSingle();
  if (error) return show(h("h1", {}, "الإعلانات المكافأة"), msg(explain(error), "err"));
  const v = (data && data.value) || { enabled: false, points_per_ad: 0, daily_limit: 0, min_watch_seconds: 15, ticket_ttl_seconds: 600 };
  const num = (id, val, min, max) => h("input", { type: "number", id, value: String(val), min, max, inputmode: "numeric" });
  const enabled = h("input", { type: "checkbox", id: "enabled", checked: !!v.enabled });
  const points = num("points", v.points_per_ad, 0, 1000), daily = num("daily", v.daily_limit, 0, 100);
  const minw = num("minw", v.min_watch_seconds, 5, 120), ttl = num("ttl", v.ticket_ttl_seconds, 60, 3600);
  const out = h("div");
  const save = h("button", { type: "submit" }, "حفظ الإعدادات");
  const form = h("form", { class: "panel", onsubmit: async (ev) => {
    ev.preventDefault(); save.disabled = true;
    const value = { enabled: enabled.checked, points_per_ad: parseInt(points.value, 10), daily_limit: parseInt(daily.value, 10),
      min_watch_seconds: parseInt(minw.value, 10), ticket_ttl_seconds: parseInt(ttl.value, 10) };
    const { error: e } = await sb.from("app_settings").upsert({ key: "rewarded_ads", value });
    save.disabled = false;
    out.replaceChildren(e ? msg(explain(e), "err") : msg("تم حفظ الإعدادات.", "ok"));
  } },
    h("div", { class: "check" }, enabled, h("label", { for: "enabled", style: "margin:0" }, "تفعيل الإعلانات المكافأة")),
    ...field("النقاط لكل إعلان", points), ...field("الحد اليومي لكل مستخدم (0 = بلا حد)", daily),
    ...field("أقل زمن مشاهدة قبل قبول المطالبة (ثانية)", minw), ...field("صلاحية التذكرة (ثانية)", ttl), out, h("p", {}, save));
  show(h("h1", {}, "الإعلانات المكافأة"), form,
    msg("هذه الإعدادات لا تثبت أن المستخدم شاهد الإعلان فعلًا؛ هي تحدّ من التكرار والتجاوز فقط. التحقق الخادمي من المزود لم يُثبَّت بعد.", "warn"));
}

// ---------- سجل التدقيق ----------
async function auditView() {
  loading("سجل التدقيق");
  const { data, error } = await sb.from("admin_audit_logs").select("*").order("created_at", { ascending: false }).limit(50);
  if (error) return show(h("h1", {}, "سجل التدقيق"), msg(explain(error), "err"));
  if (!data.length) return show(h("h1", {}, "سجل التدقيق"), h("div", { class: "panel" }, "لا توجد عمليات إدارية مسجّلة بعد."));
  show(h("h1", {}, "سجل التدقيق"), h("div", { class: "panel" }, data.map(r =>
    h("div", { class: "log" }, `${r.action} — ${r.target ?? ""}`,
      h("small", {}, new Date(r.created_at).toLocaleString("ar-EG") + " • المسؤول " + String(r.admin_id).slice(0, 8))))));
}

nav.addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-tab]"); if (!b) return;
  tab = b.dataset.tab; render();
});
logoutBtn.addEventListener("click", async () => { await sb.auth.signOut(); loginView(); });
start();

</script>
<script>
"use strict";
// أداة تقطيع صورة إلى أجزاء وإنشاء أصل مستقل لكل جزء. تعتمد على دوال admin.js (h, msg, show, field, sel, sb ...) وعلى SliceCore.

async function uploadBlobToCloudinary(blob, w, ht) {
  const res = await uploadToCloudinary(blob, "slice.png");
  if (!["png", "webp"].includes(res.format) || res.bytes > MAX_BYTES || res.width !== w || res.height !== ht) {
    throw new Error("نتيجة الرفع لا تطابق الجزء (الصيغة/الحجم/الأبعاد).");
  }
  return res;
}

function sliceView(cats, lics) {
  const core = window.SliceCore;
  const MAX_SIDE = 4096, MIN_SIDE = 16;
  const st = { canvas: null, ctx: null, w: 0, h: 0, alpha: null, rects: [], drag: null };

  const out = h("div");
  const file = h("input", { type: "file", id: "sfile", accept: "image/png,image/webp,image/jpeg" });
  const img = h("img", { alt: "الصورة المصدر", draggable: "false" });
  const stage = h("div", { class: "stage" }, img);
  const mode = sel("smode", [["grid", "شبكة منتظمة (صفوف × أعمدة)"], ["auto", "كشف تلقائي للأجزاء المنفصلة (PNG شفاف)"], ["manual", "رسم يدوي بالإصبع"]]);
  const num = (id, v, min, max) => h("input", { type: "number", id, value: String(v), min: String(min), max: String(max), inputmode: "numeric" });
  const rows = num("srows", 2, 1, 50), cols = num("scols", 2, 1, 50), margin = num("smargin", 0, 0, 2000), gap = num("sgap", 0, 0, 2000);
  const thr = num("sthr", 8, 0, 254), minArea = num("sarea", 200, 1, 10000000), merge = num("smerge", 6, 0, 500);
  const trim = h("input", { type: "checkbox", id: "strim", checked: true });
  const pad = num("spad", 0, 0, 200);
  const emptyCb = h("input", { type: "checkbox", id: "sempty", checked: true });
  const minPx = num("sminpx", 10, 1, 1000000);
  const gridBox = h("div", {}, ...field("عدد الصفوف", rows), ...field("عدد الأعمدة", cols), ...field("هامش الصورة (بكسل)", margin), ...field("مسافة بين الخلايا (بكسل)", gap));
  const autoBox = h("div", {}, ...field("حد الشفافية (0-254): ما فوقه يعدّ جزءًا من الشكل", thr),
    ...field("أقل مساحة للجزء (بكسل) — تُهمل الشوائب الأصغر", minArea),
    ...field("دمج الأجزاء المتقاربة (بكسل) — 0 لعدم الدمج", merge));
  const manualBox = h("p", { class: "hint" }, "ارسم مستطيلًا بالسحب فوق الصورة. كل رسم يضيف جزءًا. الصفحة لا تتحرك أثناء السحب على الصورة.");
  const modeBoxes = h("div", {}, gridBox, autoBox, manualBox);
  const listBox = h("div");
  const batchBox = h("div", { hidden: true });
  const prog = h("div");

  const getAlpha = () => {
    if (st.alpha) return st.alpha;
    const d = st.ctx.getImageData(0, 0, st.w, st.h).data;
    const a = new Uint8Array(st.w * st.h);
    for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3];
    return (st.alpha = a);
  };
  const toImg = (ev) => {
    const r = img.getBoundingClientRect();
    return { x: Math.min(Math.max((ev.clientX - r.left) / r.width * st.w, 0), st.w), y: Math.min(Math.max((ev.clientY - r.top) / r.height * st.h, 0), st.h) };
  };

  const syncMode = () => {
    gridBox.hidden = mode.value !== "grid"; autoBox.hidden = mode.value !== "auto"; manualBox.hidden = mode.value !== "manual";
    stage.style.touchAction = mode.value === "manual" ? "none" : "manipulation";
    applyBtn.hidden = mode.value === "manual";
  };
  mode.addEventListener("change", syncMode);

  file.addEventListener("change", () => {
    const f = file.files[0]; if (!f) return;
    const url = URL.createObjectURL(f);
    const probe = new Image();
    probe.onload = () => {
      if (probe.naturalWidth > MAX_SIDE || probe.naturalHeight > MAX_SIDE) {
        out.replaceChildren(msg(`أكبر بُعد مسموح للتقطيع ${MAX_SIDE} بكسل. صغّر الصورة أولًا.`, "err")); return;
      }
      st.w = probe.naturalWidth; st.h = probe.naturalHeight; st.alpha = null; st.rects = [];
      st.canvas = document.createElement("canvas"); st.canvas.width = st.w; st.canvas.height = st.h;
      st.ctx = st.canvas.getContext("2d", { willReadFrequently: true }); st.ctx.drawImage(probe, 0, 0);
      img.src = url; out.replaceChildren(); refresh();
    };
    probe.onerror = () => out.replaceChildren(msg("تعذّر قراءة الصورة.", "err"));
    probe.src = url;
  });

  const applyBtn = h("button", { type: "button", onclick: () => {
    if (!st.ctx) return out.replaceChildren(msg("اختر صورة أولًا.", "err"));
    try {
      let r = [];
      if (mode.value === "grid") {
        r = core.gridRects(st.w, st.h, +rows.value, +cols.value, +margin.value, +gap.value);
        if (!r.length) return out.replaceChildren(msg("الصفوف والأعمدة والهوامش لا تتسع لأبعاد الصورة.", "err"));
      } else {
        const boxes = core.findComponents(getAlpha(), st.w, st.h, +thr.value).filter(b => b.area >= +minArea.value);
        r = +merge.value > 0 ? core.mergeBoxes(boxes, +merge.value) : boxes;
        if (!r.length) return out.replaceChildren(msg("لم أجد أجزاء. إن كانت الصورة بلا شفافية (مثل JPEG) فاستخدم الشبكة أو الرسم اليدوي.", "warn"));
      }
      r = r.map(({ x, y, w, h }) => ({ x, y, w, h }));
      // الخطوة الأولى: حذف الخلايا الشفافة الفارغة، ثم تكمل بقية الخطوات على ما تبقى
      let removed = 0;
      if (emptyCb.checked) {
        const f = core.filterEmpty(getAlpha(), st.w, st.h, r, +thr.value, +minPx.value);
        r = f.kept; removed = f.removed;
        if (!r.length) { st.rects = []; refresh(); return out.replaceChildren(msg(`كل الخلايا (${removed}) شفافة فارغة، فلم يبقَ ما يُقطَّع.`, "warn")); }
      }
      if (trim.checked) r = r.map(q => core.trimRect(getAlpha(), st.w, st.h, q, +thr.value)).filter(Boolean);
      if (+pad.value > 0) r = r.map(q => core.padRect(q, +pad.value, st.w, st.h));
      st.rects = core.sortReadingOrder(r).map(q => ({ ...q, on: q.w >= MIN_SIDE && q.h >= MIN_SIDE, name: "" }));
      out.replaceChildren(msg(`تم استخراج ${st.rects.length} جزءًا` + (emptyCb.checked ? `، وحُذفت ${removed} خلية شفافة فارغة` : "") + ". راجعها واحذف ما لا تريده.", "ok"));
      refresh();
    } catch (e) { out.replaceChildren(msg("تعذّر التقطيع: " + (e.message || e), "err")); }
  } }, "تقطيع");

  // الرسم اليدوي
  stage.addEventListener("pointerdown", (ev) => {
    if (mode.value !== "manual" || !st.ctx) return;
    ev.preventDefault(); stage.setPointerCapture(ev.pointerId);
    const p = toImg(ev); st.drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y }; drawOverlay();
  });
  stage.addEventListener("pointermove", (ev) => {
    if (!st.drag) return; const p = toImg(ev); st.drag.x1 = p.x; st.drag.y1 = p.y; drawOverlay();
  });
  stage.addEventListener("pointerup", () => {
    const d = st.drag; st.drag = null; if (!d) return;
    const r = core.clampRect({ x: Math.min(d.x0, d.x1), y: Math.min(d.y0, d.y1), w: Math.abs(d.x1 - d.x0), h: Math.abs(d.y1 - d.y0) }, st.w, st.h);
    if (r.w >= 8 && r.h >= 8 && emptyCb.checked && core.countOpaque(getAlpha(), st.w, st.h, r, +thr.value) < +minPx.value) {
      out.replaceChildren(msg("المنطقة المرسومة شفافة فارغة فلم تُضَف.", "warn"));
    } else if (r.w >= 8 && r.h >= 8) {
      let q = r;
      if (trim.checked) { const t = core.trimRect(getAlpha(), st.w, st.h, r, +thr.value); if (t) q = t; }
      st.rects.push({ ...q, on: q.w >= MIN_SIDE && q.h >= MIN_SIDE, name: "" });
    }
    refresh();
  });

  function drawOverlay() {
    stage.querySelectorAll(".box").forEach(b => b.remove());
    const place = (r, cls, label) => {
      const b = h("div", { class: "box " + cls, style: `left:${r.x / st.w * 100}%;top:${r.y / st.h * 100}%;width:${r.w / st.w * 100}%;height:${r.h / st.h * 100}%` });
      if (label) b.append(h("span", { class: "lbl" }, label)); stage.append(b);
    };
    st.rects.forEach((r, i) => place(r, r.on ? "" : "off", String(i + 1)));
    if (st.drag) place({ x: Math.min(st.drag.x0, st.drag.x1), y: Math.min(st.drag.y0, st.drag.y1), w: Math.abs(st.drag.x1 - st.drag.x0), h: Math.abs(st.drag.y1 - st.drag.y0) }, "live", "");
  }

  const base = h("input", { type: "text", id: "sbase", maxlength: "70", value: "جزء" });
  const cat = sel("scat", cats.filter(x => x.active).map(x => [x.id, x.name_ar]));
  const style = sel("sstyle", Object.entries(STYLES)), angle = sel("sangle", Object.entries(ANGLES));
  const access = sel("sacc", [["free", "مجاني"], ["paid", "مدفوع"]]);
  const pts = h("input", { type: "number", id: "spts", min: "0", max: "100000", value: "0" });
  const lic = sel("slic", [["", "— بلا ترخيص (لن يمكن نشرها) —"], ...lics.map(y => [y.id, `${y.name} (${LICENSE_AR[y.status]})`])]);
  const go = h("button", { type: "button" }, "رفع وإنشاء الأصول المحددة");
  batchBox.append(h("h2", {}, "بيانات الأصول"), ...field("الاسم الأساسي (يُرقَّم تلقائيًا، ويمكن تعديل كل اسم أعلاه)", base),
    ...field("الفئة", cat), ...field("النمط الفني", style), ...field("الزاوية", angle), ...field("الوصول", access),
    ...field("التكلفة بالنقاط (للمدفوع)", pts), ...field("الترخيص", lic),
    h("div", { class: "actions" }, go), prog);

  function refresh() {
    drawOverlay();
    if (!st.rects.length) { listBox.replaceChildren(); batchBox.hidden = true; return; }
    batchBox.hidden = false;
    listBox.replaceChildren(h("h2", {}, `الأجزاء (${st.rects.filter(r => r.on).length} محدّد من ${st.rects.length})`),
      ...st.rects.map((r, i) => {
        const c = document.createElement("canvas"); const k = Math.min(1, 56 / Math.max(r.w, r.h));
        c.width = Math.max(1, Math.round(r.w * k)); c.height = Math.max(1, Math.round(r.h * k)); c.className = "thumb"; c.style.width = c.style.height = "56px";
        c.getContext("2d").drawImage(st.canvas, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
        const small = r.w < MIN_SIDE || r.h < MIN_SIDE;
        const cb = h("input", { type: "checkbox", id: "on" + i, checked: r.on, disabled: small, onchange: (e) => { r.on = e.target.checked; refresh(); } });
        const nm = h("input", { type: "text", id: "nm" + i, maxlength: "80", placeholder: `${base.value || "جزء"} ${i + 1}`, value: r.name,
          oninput: (e) => { r.name = e.target.value; } });
        return h("div", { class: "card" }, c, h("div", { class: "body" },
          h("div", { class: "check" }, cb, h("label", { for: "on" + i, style: "margin:0" }, `#${i + 1} — ${r.w}×${r.h}`),
            small ? h("span", { class: "badge rejected" }, "أصغر من 16 بكسل") : ""),
          nm, h("div", { class: "actions" }, h("button", { type: "button", class: "small danger", onclick: () => { st.rects.splice(i, 1); refresh(); } }, "حذف"))));
      }));
  }

  go.addEventListener("click", async () => {
    const picked = st.rects.map((r, i) => ({ r, i })).filter(({ r }) => r.on);
    if (!picked.length) return prog.replaceChildren(msg("لم تحدد أي جزء.", "err"));
    if (!cat.value) return prog.replaceChildren(msg("لا توجد فئة مفعّلة. أنشئ الفئات أولًا.", "err"));
    if (access.value === "paid" && !(parseInt(pts.value, 10) > 0)) return prog.replaceChildren(msg("الأصل المدفوع يحتاج تكلفة أكبر من 0.", "err"));
    if (!confirm(`سيُنشأ ${picked.length} أصلًا كمسودة. متابعة؟`)) return;
    go.disabled = true;
    const lines = picked.map(({ r, i }) => h("div", { class: "log" }, `#${i + 1}: بانتظار الدور`));
    prog.replaceChildren(h("div", { class: "panel" }, lines));
    let ok = 0;
    for (let n = 0; n < picked.length; n++) {
      const { r, i } = picked[n];
      const set = (t) => { lines[n].textContent = `#${i + 1}: ${t}`; };
      try {
        set("جارٍ التجهيز…");
        const c = document.createElement("canvas"); c.width = r.w; c.height = r.h;
        c.getContext("2d").drawImage(st.canvas, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
        const blob = await new Promise(res => c.toBlob(res, "image/png"));
        if (!blob) throw new Error("تعذّر إنشاء الصورة");
        if (blob.size > MAX_BYTES) throw new Error("الحجم يتجاوز 5 ميغابايت");
        set("جارٍ الرفع…");
        const res = await uploadBlobToCloudinary(blob, r.w, r.h);
        const version = { file_type: res.format, file_public_id: res.public_id, thumb_public_id: res.public_id, width: res.width,
          height: res.height, file_bytes: res.bytes, sha256: await sha256Hex(blob), anchors: [], compatibility: {}, min_app_version: 1 };
        const name = (r.name.trim() || `${base.value.trim() || "جزء"} ${i + 1}`).slice(0, 80);
        const { error } = await sb.rpc("admin_create_asset", { p_category: cat.value, p_name: name, p_style: style.value, p_angle: angle.value,
          p_access: access.value, p_points: access.value === "free" ? 0 : parseInt(pts.value, 10), p_license: lic.value || null, p_version: version });
        if (error) throw error;
        ok++; set("تم ✓");
      } catch (e) { set("فشل: " + (e instanceof Error && !("code" in e) ? e.message : explain(e))); }
    }
    go.disabled = false;
    prog.append(msg(`اكتمل: ${ok} نجح من ${picked.length}. الأصول الناجحة مسودات؛ أضف نقاط التثبيت بـ«نسخة جديدة» إن لزم، واعتمد الترخيص ثم انشر.`, ok === picked.length ? "ok" : "warn"),
      h("div", { class: "actions" }, h("button", { type: "button", onclick: () => assetsView() }, "العودة إلى الأصول")));
  });

  syncMode();
  show(h("h1", {}, "تقطيع صورة إلى أجزاء"),
    h("div", { class: "panel" },
      h("p", { class: "hint" }, "ارفع صورة كبيرة (لوحة أجزاء أو شخصية كاملة) وقسّمها إلى أجزاء، فيصير كل جزء أصلًا مستقلًا. الأصل يُحفظ PNG بشفافيته. تأكد أنك تملك حقوق الصورة."),
      ...field("الصورة (PNG أو WebP أو JPEG، حتى 4096×4096)", file), stage, ...field("طريقة التقطيع", mode), modeBoxes,
      h("div", { class: "check" }, emptyCb, h("label", { for: "sempty", style: "margin:0" }, "الخطوة 1: حذف الخلايا الشفافة الفارغة قبل التقطيع")),
      ...field("أقل عدد بكسلات مرئية لتُعدّ الخلية غير فارغة (يتجاهل الشوائب)", minPx),
      h("div", { class: "check" }, trim, h("label", { for: "strim", style: "margin:0" }, "الخطوة 2: قص الحواف الشفافة حول كل جزء")),
      ...field("حشوة حول كل جزء (بكسل)", pad), h("div", { class: "actions" }, applyBtn,
        h("button", { type: "button", class: "secondary", onclick: () => { st.rects = []; refresh(); } }, "مسح الأجزاء"),
        h("button", { type: "button", class: "secondary", onclick: () => assetsView() }, "رجوع")), out),
    h("div", { class: "panel" }, listBox, batchBox));
}

</script>
